name: Deploy to EC2 with Docker

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      # 4. GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/final_project-be
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      # 6. docker-compose.yml EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      # 7. EC2에서 배포
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
          script: |
            set -e

            mkdir -p ~/app/secrets

            sudo systemctl stop runspot 2>/dev/null || true
            sudo systemctl disable runspot 2>/dev/null || true

            echo "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > ~/app/secrets/firebase-service-account.json
            chmod 600 ~/app/secrets/firebase-service-account.json

            echo "DB_URL=${{ secrets.DB_URL }}" > ~/app/.env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> ~/app/.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ~/app/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ~/app/.env
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> ~/app/.env
            echo "RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}" >> ~/app/.env
            echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> ~/app/.env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> ~/app/.env
            echo "PUSH_FCM_ENABLED=true" >> ~/app/.env

            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/app/.env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/app/.env
            echo "AWS_REGION=ap-northeast-2" >> ~/app/.env
            echo "AWS_S3_BUCKET=runspot-s3-bucket" >> ~/app/.env
            echo "AWS_S3_PUBLIC_BASE_URL=https://runspot-s3-bucket.s3.ap-northeast-2.amazonaws.com" >> ~/app/.env

            cd ~/app
            docker compose pull app
            docker compose up -d
            sleep 5
            docker compose ps
            docker compose logs --tail=20 app
