spring:
  config:
    import:
      - "optional:classpath:application-secret.yml"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

sentry:
  dsn: ${SENTRY_DSN}
  environment: ${SENTRY_ENVIRONMENT:local}
  # 요청 헤더, IP 등 사용자 식별 정보를 함께 전송 (https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/)
  send-default-pii: true
  traces-sample-rate: 0.2
  exception-resolver-order: -2147483647 # 최우선순위(Integer.MIN_VALUE)로 예외를 먼저 캡처

---
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

sentry:
  environment: prod
  traces-sample-rate: 0.1