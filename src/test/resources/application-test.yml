  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1oczI1Ng==
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

sentry:
  dsn: ""
  enabled: false

notification:
  reminder:
    enabled: false
